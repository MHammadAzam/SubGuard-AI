[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subguard-backend"
version = "0.1.0"
description = "Deterministic insurance certificate compliance engine and backend for SubGuard AI"
authors = [{ name = "SubGuard AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.2",
    "uvicorn>=0.30.6",
    "pymupdf>=2.0.0",
    "pypdf>=6.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
